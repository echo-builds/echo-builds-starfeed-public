name: Audit RepoScroll live recommendations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-live-feed.yml
      - index.html
      - api/project.js
      - api/github/stars.js
      - test/**

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run existing tests
        run: npm test

  production-feed-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Request public production feed and report first 20 projects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://echo-builds-starfeed.vercel.app/api/discover?page=1";
          console.log("Checking:", url);
          console.log("Validating Cloudflare Workers AI free path and production homepage");
          const response = await fetch(url, {
            headers: {Accept: "application/json", "User-Agent": "RepoScroll-Feed-Audit/1.0"},
            signal: AbortSignal.timeout(120000)
          });
          const body = await response.text();
          console.log("HTTP status:", response.status);
          console.log("Content type:", response.headers.get("content-type"));
          console.log("Deployment diagnostics included:", Boolean(JSON.parse(body).diagnostics));
          let payload;
          try { payload = JSON.parse(body); }
          catch { throw new Error("Invalid JSON response: " + body.slice(0,400)); }
          if (!response.ok) throw new Error("Production API failed: " + JSON.stringify(payload).slice(0,500));
          if (!Array.isArray(payload.items)) throw new Error("Missing items array");
          const records = payload.items.slice(0,20).map((p,i)=>({
            rank:i+1,
            repo:p.full_name,
            stars:p.stargazers_count,
            created_at:p.created_at,
            selection_reason:p.selection_reason,
            category:p.attention_category,
            title:p.ai_title,
            summary:p.ai_summary,
            original_description:p.description,
            cover:p.cover,
            evidence_quotes:p.evidence_quotes
          }));
          console.log("AUDIT_RESULT_START");
          console.log(JSON.stringify({
            count:payload.items.length,
            classifier:payload.classifier,
            diagnostics:payload.diagnostics,
            audited_at:new Date().toISOString(),
            method:payload.method,
            page:payload.page,
            items:records
          },null,2));
          console.log("AUDIT_RESULT_END");
          if (payload.items.length < 8) console.warn("WARNING: fewer than 8 projects; do not bypass relevance rules to fill slots");
          NODE
