name: Scan RepoScroll feed

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/scan-feed.cjs
      - scripts/audit-feed.cjs
      - api/_lib/project-content.js
      - package.json
      - .github/workflows/scan-feed.yml
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill target (0 for normal scan)'
        required: false
        default: '0'
      refresh:
        description: 'Re-audit and prepare existing published projects'
        required: false
        default: '0'

concurrency:
  group: reposcroll-feed-scan
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ vars.FEED_SCANNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Apply database schema
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Scan and publish feed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run feed:refresh
          elif [ "${{ inputs.refresh || '0' }}" != "0" ]; then
            node scripts/scan-feed.cjs --refresh="${{ inputs.refresh }}"
          elif [ "${{ inputs.backfill || '0' }}" = "0" ]; then
            npm run feed:scan
          else
            node scripts/scan-feed.cjs --backfill="${{ inputs.backfill }}"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_API_TOKEN: ${{ github.token }}
          FREE_AI_PROVIDER: ${{ vars.FREE_AI_PROVIDER }}
          ENABLE_FREE_GEMINI: ${{ vars.ENABLE_FREE_GEMINI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Audit feed quality
        run: npm run feed:audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
