      <style>
:root{color-scheme:light;--paper:#fbfaf7;--white:#fff;--ink:#1b1816;--muted:#655f59;--rule:#ebe5df;--red:#c8302c;font:16px/1.5 "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",Inter,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
[hidden]{display:none!important}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.masthead{position:sticky;top:0;z-index:2;background:rgba(251,250,247,.94);border-bottom:1px solid var(--rule);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
.header-inner{max-width:1080px;margin:auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding-inline:16px}
.brand{font-weight:800;display:flex;align-items:center;gap:8px;font-size:18px}
.brand img{width:28px;height:28px;border-radius:8px}
.close{display:grid;place-items:center;border:0;background:transparent;width:44px;height:44px;border-radius:50%;flex-shrink:0;line-height:1;font-size:23px}
.header-actions{display:flex;align-items:center;gap:2px}
.account{border:1px solid var(--rule);background:#fff;border-radius:18px;padding:6px 11px;font-size:12px;font-weight:700;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account.connected{border-color:#c9dfc7;background:#f2f8f0;color:#35603b}
main{max-width:1080px;margin:auto;padding:20px 12px calc(148px + env(safe-area-inset-bottom))}
.heading{padding:0 3px 14px}
h1{font-size:31px;line-height:1.15;letter-spacing:-.03em;margin:0 0 5px}
.heading p,.status{font-size:13px;color:var(--muted);margin:0}
.status{margin:0 3px 11px;font-size:11px}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:12px 9px}
.feed-sentinel{min-height:72px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.card{background:white;border:1px solid var(--rule);border-radius:11px;min-width:0;overflow:hidden}
.project{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.project:focus-visible{outline-offset:-3px}
.cover{overflow:hidden;background:#f7efe5}
.product-image{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#f3f1ee}

.text-cover p{font-size:clamp(13px,3.65vw,18px);line-height:1.52;font-weight:700;margin:0;overflow-wrap:anywhere}
.text-cover{padding:15px 13px;align-items:center;position:relative;isolation:isolate;overflow:hidden;background:var(--cover-bg,#f3e3d4)}
.text-cover::before{content:"";position:absolute;inset:0;z-index:-1}
.text-cover p{line-height:1.48;font-weight:750;letter-spacing:-.015em}
.cover-tone-0{--cover-bg:#f3ddcc;align-items:flex-end}.cover-tone-0::before{background:radial-gradient(circle at 82% 16%,#d8755e 0 13%,transparent 13.5%),linear-gradient(145deg,transparent 0 66%,#ebc4ae 66%)}
.cover-tone-1{--cover-bg:#dce7ed;align-items:flex-start}.cover-tone-1::before{background:linear-gradient(90deg,transparent 49%,#b9cbd455 50%,transparent 51%),linear-gradient(0deg,transparent 49%,#b9cbd455 50%,transparent 51%);background-size:25px 25px}
.cover-tone-2{--cover-bg:#dfe8d5;align-items:center}.cover-tone-2::before{background:radial-gradient(circle at 100% 100%,transparent 0 34%,#afc49d 34.5% 49%,transparent 49.5%)}
.cover-tone-3{--cover-bg:#e8ddeb;align-items:flex-end}.cover-tone-3::before{background:linear-gradient(125deg,transparent 0 55%,#ceb9d5 55% 68%,transparent 68%),radial-gradient(circle at 18% 18%,#fff8 0 7%,transparent 7.5%)}
.cover-tone-4{--cover-bg:#eee1b9;align-items:flex-start}.cover-tone-4::before{background:radial-gradient(#b79847 1.2px,transparent 1.5px);background-size:16px 16px;opacity:.42}
.cover-tone-5{--cover-bg:#dfded8;align-items:center}.cover-tone-5::before{inset:12px;border:1px solid #aaa69b;border-radius:999px;transform:scale(1.35)}
.card-copy{padding:8px 9px 3px}
.card-copy h2{font-size:14px;line-height:1.43;margin:0;font-weight:700;overflow-wrap:anywhere}
.card-meta{min-height:32px;padding:3px 9px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;color:var(--muted);font-size:clamp(9px,2.35vw,11px);font-variant-numeric:tabular-nums}
.stars{font-weight:650;color:#815121;white-space:nowrap}
.published{white-space:nowrap}
.theme-name{margin:0 2px 8px;font-size:17px}
#groups section+section{margin-top:23px}
.empty{border:1px dashed var(--rule);border-radius:14px;text-align:center;padding:35px 14px;margin:12px 0;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 7px}
.empty p{margin:0 0 14px;font-size:14px}
.primary,.secondary{font-size:13px;font-weight:700;border-radius:9px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--rule)}
.secondary{background:#fff}
.primary{background:var(--red);color:#fff;border-color:var(--red)}
.save[aria-pressed=true]{color:var(--red)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.search-dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom));z-index:3;width:min(420px,calc(100% - 20px));padding:8px 0}
.search-dock form{display:flex;align-items:center;gap:5px;min-height:48px;padding:5px 5px 5px 15px;border:1px solid #dfd8d1;border-radius:25px;background:rgba(255,255,255,.97);box-shadow:0 7px 25px #32251b1a;backdrop-filter:blur(14px)}
.search-dock input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:14px/1.4 inherit;padding:7px 0}
.search-dock input::placeholder{color:#8b847d}
.search-clear,.search-submit{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:0;border-radius:50%;font-size:22px;line-height:1}
.search-clear{background:transparent;color:var(--muted)}
.search-submit{background:var(--ink);color:#fff;font-size:20px}
.search-submit:disabled{opacity:.45;cursor:progress}
.bottom{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid var(--rule);z-index:2;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}
.bottom div{max-width:420px;margin:auto;display:flex}
.bottom button{flex:1;display:grid;place-items:center;gap:2px;padding:6px 0;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700}
.bottom button span{font-size:20px;line-height:23px}
.bottom button[aria-current=page]{color:var(--red)}
dialog{border:0;border-radius:0;color:var(--ink);background:#fff;max-width:100%;width:100%;height:100%;max-height:100%;padding:0;margin:0;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:#18161280}
.dialog-top{position:sticky;top:0;background:white;z-index:1;display:flex;align-items:center;gap:3px;padding:max(env(safe-area-inset-top),4px) 12px 4px;border-bottom:1px solid var(--rule);min-height:51px;font-size:13px;color:var(--muted)}
.close{font-size:32px}
#details{padding:20px 17px calc(25px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
#details h2{font-size:25px;line-height:1.27;margin:0}
#details .detail-meta{font-size:12px;color:var(--muted);margin:7px 0 22px}
#details section{margin:0 0 18px}
#details section h3{font-size:17px;margin:0 0 4px}
#details section p,#details section li{font-size:14px;line-height:1.68}
#details section p{margin:0 0 8px}
#details section ul{margin:7px 0 0;padding-left:1.2em}
#details section li+li{margin-top:7px}
#details figure{margin:14px 0 18px}
#details figure img{display:block;width:100%;max-height:390px;object-fit:contain;border-radius:10px;background:#f3f1ee}
#details figcaption{font-size:11px;color:var(--muted);margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1.08fr .72fr;gap:8px;padding-top:12px;border-top:1px solid var(--rule)}
.actions>*{min-width:0;padding-inline:7px;text-align:center}
.save-status{font-size:12px;color:var(--muted)}
.auth-panel{padding:22px 20px 28px}
.auth-panel h2{font-size:24px;line-height:1.25;margin:0 0 9px}
.auth-panel p{color:var(--muted);font-size:14px;margin:0 0 15px}
.auth-panel .primary,.auth-panel .secondary{width:100%;min-height:46px;margin-top:8px}
.device-code{display:block;margin:14px 0 7px;padding:14px;border:1px dashed #c9beb4;border-radius:12px;background:#f7f3ee;text-align:center;font:800 25px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.auth-note{font-size:12px!important}
.account-line{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:12px;border-radius:12px;background:#f6f4f1}
.account-line img{width:38px;height:38px;border-radius:50%}
.account-line strong{display:block}
.top-nav{display:none;align-items:center;gap:4px}
.top-nav button,.install-app{border:0;background:transparent;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:750;color:var(--muted)}
.top-nav button[aria-current=page]{background:#f1ebe5;color:var(--ink)}
.install-app{border:1px solid var(--rule);background:#fff;color:var(--ink)}
.install-panel{padding:26px 24px 30px}

<script type="module">
const MIN_STARS = 500;
const DAY = 86400000;
const DISCOVERY_WINDOW_DAYS = 14;
const ignored = new Set(['ai','open-source','javascript','typescript','python','react','opensource','web','app','github','go','rust','self-hosted','nextjs','docker']);
const repoKey = ({full_name}) => full_name.toLowerCase();

function topicsOf(repo) {
  return [...new Set((repo.topics || []).filter(t => typeof t === 'string' && /^[a-z0-9][a-z0-9-]{1,39}$/.test(t) && !ignored.has(t)))];
}
function rank(repos, saved, now = Date.now()) {
  const read = new Set(saved.map(repoKey));
  const topicWeights = new Map();
  const themeWeights = new Map();
  for (const repo of saved) {
    const tags = topicsOf(repo);
    for (const tag of tags) topicWeights.set(tag,(topicWeights.get(tag) || 0) + 1 / Math.sqrt(tags.length));
    if (repo.theme) themeWeights.set(repo.theme,(themeWeights.get(repo.theme) || 0) + 1);
  }
  return repos.filter(repo => repo.stargazers_count >= MIN_STARS).map(repo => {
    const date = Date.parse(repo.published_at || repo.created_at || repo.observed_at || '');
    const age = Number.isFinite(date) ? Math.max(0,(now - date) / DAY) : 365;
    const freshness = 8 / (1 + age / 30);
    const popularity = Math.log2(repo.stargazers_count / MIN_STARS);
    const base = freshness + popularity;
    const interest = topicsOf(repo).reduce((sum, tag) => sum + (topicWeights.get(tag) || 0),0) + (themeWeights.get(repo.theme) || 0);
    return {repo,age,base,band:Math.floor(base * 4),interest};
  }).filter(item => item.repo.forPM || (item.interest > 0 && item.age < 90))
    .sort((a,b) => b.band - a.band || b.interest - a.interest || b.base - a.base || b.repo.stargazers_count - a.repo.stargazers_count)
    .map(item => item.repo);
}

function groupSaved(repos) {
  const groups = new Map();
  for (const repo of repos) {
    const theme = repo.theme || '其他项目';
    if (!groups.has(theme)) groups.set(theme,[]);
    groups.get(theme).push(repo);
  }
  return groups;
}

function safeUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return null;
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && !url.username && !url.password ? url.href : null;
  } catch { return null; }
}

      }
      for (const text of item.paragraphs || []) block.append(paragraph(text));
      if (item.bullets?.length) {
        const list = document.createElement(item.ordered ? 'ol' : 'ul');
        for (const text of item.bullets) {
          const row = document.createElement('li');
          row.textContent = text;
          list.append(row);
        }
        block.append(list);
      }
      details.append(block);
    }
  }
  if (repo.cover) {
    const figure = document.createElement('figure');
    figure.hidden = true;
    const img = document.createElement('img');
    const caption = document.createElement('figcaption');
    caption.textContent = '项目实际界面';
    img.alt = '项目界面截图';
    img.onload = ()=>{ figure.hidden = false; };
    img.src = repo.cover;
    figure.append(img,caption);
    details.append(figure);
  }
  const actions = document.createElement('div');
  actions.className = 'actions';
  const experience = experienceOf(repo);
  actions.append(external(repo.url,'查看 GitHub'));
  actions.append(external(experience.url,experience.label,'primary'));
  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'secondary save';
  updateSave(save,repo);
  save.addEventListener('click',async()=>{
    const key = repoKey(repo);
    const wasSaved = state.saved.has(key);
    if (wasSaved) state.saved.delete(key); else state.saved.set(key,repo);
    const persisted = storage.put('saved',[...state.saved.values()]);
    updateSave(save,repo);
    const notice = $('#save-status');
    notice.textContent = persisted ? (state.auth ? '正在同步 GitHub…' : (state.saved.has(key) ? '已加入「' + (repo.theme || '其他项目') + '」' : '已取消收藏')) : '设备未能保存到本地';
    notice.hidden = false;
    if (state.auth) {
      try {
        await setGitHubStar(repo,!wasSaved);
        notice.textContent = !wasSaved ? '已收藏，并同步到 GitHub' : '已取消收藏，并同步到 GitHub';
      } catch {
        if (wasSaved) state.saved.set(key,repo); else state.saved.delete(key);
        storage.put('saved',[...state.saved.values()]);
        updateSave(save,repo);
        notice.textContent = 'GitHub 同步失败，收藏状态已恢复';
      }
    }
  });
  actions.append(save);
  const notice = paragraph('','save-status');
  notice.id = 'save-status';
  notice.setAttribute('role','status');
  notice.hidden = true;
  details.append(actions,notice);
  $('#detail').showModal();
  $('#detail').scrollTop = 0;
}
function openRouteDetail() {
  const wanted = new URLSearchParams(location.search).get('repo');
  if (!wanted) {
    if ($('#detail').open) $('#detail').close();
    return;
  }
  const key = wanted.toLowerCase();
  const repos = [...getCatalog(),...state.saved.values(),...state.search.items];
  const repo = repos.find(item=>repoKey(item) === key);
  if (repo && detailReady(repo)) openDetails(repo,null,{pushRoute:false});
}
function closeDetailRoute() {
  const url = new URL(location.href);
  if (url.searchParams.has('repo')) {
    if (history.state?.detail) return history.back();
    url.searchParams.delete('repo');
    history.replaceState({},'',url);
  }
  $('#detail').close();
}
const masonry = 'ResizeObserver' in window ? new ResizeObserver(entries=>{
  for (const {target} of entries) {
    const height = target.getBoundingClientRect().height;
    if (height > 0) target.style.gridRowEnd = 'span ' + (Math.ceil(height) + 12);
  }
}) : null;
function observeCards(feed) {
  if (!masonry) return;
  feed.classList.add('masonry');
  for (const card of feed.children) masonry.observe(card);
}
function render() {
  const savedView = state.view === 'saved';
  const searchView = state.view === 'search';
  const catalog = getCatalog();
  const favorites = readFavorites(catalog);
  const items = savedView ? favorites : searchView ? state.search.items : getDiscoverCatalog();
  $('#heading').textContent = savedView ? '收藏' : searchView ? '搜索结果' : '推荐';
  $('#lede').textContent = savedView ? '按主题回看收藏过的项目' : searchView ? `“${state.search.query}”` : '持续发现 GitHub 上新近出现的高星项目';
  $('#search-dock').hidden = savedView;
  for (const tab of document.querySelectorAll('[data-view]')) {
    if (tab.dataset.view === state.view || (searchView && tab.dataset.view === 'discover')) tab.setAttribute('aria-current','page'); else tab.removeAttribute('aria-current');
  }
  const feed = $('#feed'), groups = $('#groups');
  const sentinel = $('#feed-sentinel');
  feed.hidden = savedView;
  groups.hidden = !savedView;
  sentinel.hidden = savedView || searchView;
  if (!sentinel.hidden) sentinel.textContent = state.loadingMore ? '正在加载更多…' : state.discoveryDone ? '已经看到 GitHub 最早期的项目' :
    state.refreshError ? '暂时无法继续加载，向上滑动后再试' : '继续下滑，发现更早的高星项目';
  masonry?.disconnect();
  feed.replaceChildren();
  groups.replaceChildren();
  if (savedView) {
    for (const [theme,projects] of groupSaved(items)) {
      const section = document.createElement('section');
      const label = document.createElement('h2');
      label.className = 'theme-name';
      label.textContent = theme + ' · ' + projects.length;
      const list = document.createElement('div');
      list.className = 'feed';
      list.append(...projects.map(card));
      section.append(label,list);
      groups.append(section);
      observeCards(list);
    }
  } else {
    feed.append(...items.map(card));
    observeCards(feed);
  }
  const empty = $('#empty');
  empty.hidden = items.length > 0;
  empty.querySelector('h2').textContent = savedView ? '还没有收藏' : searchView ? '没有找到合适的项目' : '暂时没有新项目';
  empty.querySelector('p').textContent = savedView ? '打开项目详情后，可以把想留着看的项目收进这里。' : searchView ? '换一个更具体的说法，例如“把播客转成中文字幕”。' : '晚点再回来发现新项目。';
  empty.querySelector('button').hidden = !savedView;
  updateStatus();
}
function go(view) {
  state.view = view;
  const url = new URL(location.href);
  url.searchParams.delete('repo');
  if (view === 'saved') url.searchParams.set('view','saved'); else url.searchParams.delete('view');
  history.replaceState({},'',url);
  if (view === 'discover') {
    state.search = {query:'',items:[],loading:false,error:''};
    $('#project-search').value = '';
    $('#search-clear').hidden = true;
  }
  render();
  window.scrollTo(0,0);
}
async function setGitHubStar(repo,saved) {
  const response = await fetch('/api/github/stars?repo=' + encodeURIComponent(repo.full_name),{
    method:saved ? 'PUT' : 'DELETE',headers:{Accept:'application/json'}
  });
  if (response.status === 401) {
    state.auth = null;
    renderAccount();
    throw new Error('登录已过期');
  }
  if (!response.ok && response.status !== 204) throw new Error('GitHub HTTP ' + response.status);
}
async function syncGitHubStars({preserveLocal = true} = {}) {
  if (!state.auth) return;
  const remote = new Map();
  for (let page = 1; page <= 10; page++) {
    const response = await fetch('/api/github/stars?page=' + page,{headers:{Accept:'application/json'}});
    if (response.status === 401) {
      state.auth = null;
      renderAccount();
      throw new Error('登录已过期');
    }
    if (!response.ok) throw new Error('GitHub HTTP ' + response.status);
    const data = await response.json();
    const items = Array.isArray(data.items) ? data.items : [];
    for (const item of items) {
      const repo = enrich({...shape(item),searchResult:true});
      remote.set(repoKey(repo),repo);
    }
    if (!data.hasMore) break;
  }
  const localOnly = preserveLocal ? [...state.saved.values()].filter(repo=>!remote.has(repoKey(repo))) : [];
  state.remoteSaved = remote;
  state.pendingLocal = localOnly;
  state.saved = new Map([...remote,...localOnly.map(repo=>[repoKey(repo),repo])]);
  storage.put('saved',[...state.saved.values()]);
  renderAccount();
  render();
}
function renderAccount() {
  const signedIn = Boolean(state.auth?.user);
  $('#account').textContent = signedIn ? '@' + state.auth.user.login : '登录 GitHub';
  $('#account').classList.toggle('connected',signedIn);
  $('#auth-signed-out').hidden = signedIn;
  $('#auth-signed-in').hidden = !signedIn;
  $('#local-import').hidden = !signedIn || state.pendingLocal.length === 0;
  if (signedIn) {
    $('#auth-login').textContent = '@' + state.auth.user.login;
    $('#auth-avatar').src = state.auth.user.avatar_url || '';
    $('#local-import-count').textContent = exact.format(state.pendingLocal.length);
  }
}
function startGitHubLogin() {
  const returnTo = location.pathname + location.search;
  location.href = '/api/auth/login?returnTo=' + encodeURIComponent(returnTo);
}
async function bootstrapAuth() {
  try {
    const response = await fetch('/api/auth/session',{headers:{Accept:'application/json'}});
    if (!response.ok) return;
    const data = await response.json();
    if (!data.user) return;
    state.auth = {user:data.user};
    renderAccount();
    await syncGitHubStars({preserveLocal:true});
    if (new URLSearchParams(location.search).has('connected')) {
      const url = new URL(location.href);
      url.searchParams.delete('connected');
      history.replaceState({},'',url);
    }
  } catch {}
}
for (const tab of document.querySelectorAll('[data-view]')) tab.addEventListener('click',()=>go(tab.dataset.view));
$('#search-form').addEventListener('submit',event=>{ event.preventDefault(); searchGitHub($('#project-search').value); });
$('#project-search').addEventListener('input',event=>{ $('#search-clear').hidden = !event.target.value; });
$('#search-clear').addEventListener('click',()=>{ go('discover'); $('#project-search').focus(); });
$('#empty button').addEventListener('click',()=>go('discover'));
const discoveryObserver = new IntersectionObserver(entries=>{
  if (entries.some(entry=>entry.isIntersecting) && state.view === 'discover') loadDiscover();
},{rootMargin:'600px 0px'});
discoveryObserver.observe($('#feed-sentinel'));
$('#detail .close').addEventListener('click',closeDetailRoute);
$('#detail').addEventListener('cancel',event=>{ event.preventDefault(); closeDetailRoute(); });
$('#account').addEventListener('click',()=>{ renderAccount(); $('#auth-dialog').showModal(); });
$('#auth-dialog .close').addEventListener('click',()=>$('#auth-dialog').close());
$('#auth-start').addEventListener('click',startGitHubLogin);
$('#auth-sync').addEventListener('click',async()=>{ $('#auth-sync').textContent='同步中…'; try { await syncGitHubStars(); $('#auth-sync').textContent='同步完成'; } catch { $('#auth-sync').textContent='同步失败，请重试'; } });
$('#local-import-yes').addEventListener('click',async()=>{
  const button = $('#local-import-yes');
  button.disabled = true;
  button.textContent = '同步中…';
  try {
    for (const repo of state.pendingLocal) await setGitHubStar(repo,true);
    state.pendingLocal = [];
    await syncGitHubStars({preserveLocal:false});
  } catch {
    button.textContent = '部分同步失败，请重试';
  } finally { button.disabled = false; }
});
$('#local-import-no').addEventListener('click',()=>{
  state.pendingLocal = [];
  state.saved = new Map(state.remoteSaved);
  storage.put('saved',[...state.saved.values()]);
  renderAccount();
  render();
});
$('#auth-logout').addEventListener('click',async()=>{
  await fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});
  state.auth = null;
  state.remoteSaved = new Map();
  state.pendingLocal = [];
  renderAccount();
});
renderAccount();
$('#detail').addEventListener('close',()=>{
  state.openRepo = null;
  render();
  const key = state.trigger?.dataset.project;
  const restored = [...document.querySelectorAll('[data-project]')].find(node=>node.dataset.project === key);
  restored?.focus({preventScroll:true});
});
window.addEventListener('popstate',openRouteDetail);
document.addEventListener('visibilitychange',()=>{
  if (!document.hidden && Date.now() - state.lastFetch > 10 * 60 * 1000) loadDiscover({reset:true});
});
let installPrompt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function updateInstallButton() {
  $('#install-app').hidden = standalone || (!installPrompt && !isIOS);
}
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt = event;
  updateInstallButton();
});
window.addEventListener('appinstalled',()=>{ installPrompt = null; $('#install-app').hidden = true; });
$('#install-app').addEventListener('click',async()=>{
  if (installPrompt) {
    await installPrompt.prompt();
    await installPrompt.userChoice.catch(()=>null);
    installPrompt = null;
    updateInstallButton();
    return;
  }
  $('#install-copy').textContent = '在 Safari 底部点“分享”，再选择“添加到主屏幕”。之后可以像普通 App 一样从桌面打开。';
  $('#install-confirm').hidden = true;
  $('#install-dialog').showModal();
});
$('#install-dialog .close').addEventListener('click',()=>$('#install-dialog').close());
$('#install-confirm').addEventListener('click',()=>$('#install-app').click());
updateInstallButton();
if (location.protocol !== 'file:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
document.querySelector('.brand span').textContent = 'Starfeed';
document.querySelector('.brand').setAttribute('aria-label','Starfeed 首页');
document.querySelector('.brand img').src = '/icons/icon-192.png';
render();
openRouteDetail();
loadDiscover({reset:true});
bootstrapAuth();

</script>
</body>
</html>
